{% extends "base.html" %}

{% block title %}Login - E-Vura{% endblock %}

{% block extra_css %}
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #f6f8fa;
        overflow: hidden;
        height: 100vh;
    }
    
    .login-container {
        height: 100vh;
        width: 100%;
        display: flex;
        background: #f6f8fa;
        overflow: hidden;
    }
    
    .login-wrapper {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        align-items: stretch;
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.08);
        overflow: hidden;
    }
    
    .form-section {
        background: white;
        padding: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
        border-right: 1px solid rgba(0, 0, 0, 0.08);
    }
    
    .form-content {
        width: 100%;
        padding: 2.5rem;
        max-width: 500px;
        margin: 0 auto;
    }
    
    .form-header {
        margin-bottom: 2rem;
        text-align: center;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    
    .form-header a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: #0d9488;
        text-decoration: none;
        margin-bottom: 1.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.2s ease;
    }
    
    .form-header a:hover {
        color: #0f766e;
    }
    
    .form-header h1 {
        font-size: 1.75rem;
        font-weight: 600;
        color: #24292f;
        margin-bottom: 0.5rem;
    }
    
    .form-header p {
        color: #57606a;
        font-size: 0.875rem;
    }
    
    .form-group {
        margin-bottom: 1.25rem;
        position: relative;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #24292f;
        font-size: 0.875rem;
    }
    
    .input-wrapper {
        position: relative;
    }
    
    .form-group input,
    .form-group select {
        width: 100%;
        padding: 0.625rem 0.875rem;
        border: 1px solid #d1d9e0;
        border-radius: 6px;
        font-size: 0.875rem;
        transition: all 0.2s ease;
        background: white;
        color: #24292f;
        font-family: inherit;
    }
    
    .form-group input[type="password"] {
        padding-right: 2.5rem;
    }
    
    .form-group input::placeholder {
        color: #8b949e;
    }
    
    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: #0d9488;
        box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
    }
    
    .form-group input:hover:not(:focus),
    .form-group select:hover:not(:focus) {
        border-color: #a8b3be;
    }
    
    .password-toggle {
        position: absolute;
        right: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #57606a;
        cursor: pointer;
        padding: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s ease;
        font-size: 0.875rem;
    }
    
    .password-toggle:hover {
        color: #0d9488;
    }
    
    .form-footer {
        text-align: center;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(0, 0, 0, 0.08);
    }
    
    .form-footer p {
        color: #57606a;
        margin-bottom: 0.75rem;
        font-size: 0.8125rem;
    }
    
    .form-footer a {
        color: #0d9488;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.8125rem;
    }
    
    .form-footer a:hover {
        color: #0f766e;
    }
    
    .btn {
        width: 100%;
        padding: 0.625rem;
        font-size: 0.875rem;
        font-weight: 500;
        border-radius: 6px;
        transition: all 0.2s ease;
        border: none;
        cursor: pointer;
    }
    
    .btn-primary {
        background: #0d9488;
        color: white;
    }
    
    .btn-primary:hover {
        background: #0f766e;
    }
    
    .image-section {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
    }
    
    .image-section img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.9;
    }
    
    @media (max-width: 968px) {
        .login-wrapper {
            grid-template-columns: 1fr;
        }
        
        .image-section {
            display: none;
        }
        
        .form-content {
            padding: 2rem;
        }
        
        .form-section {
            border-right: none;
        }
    }
</style>
{% endblock %}

{% block content1 %}
<div class="login-container">
    <div class="login-wrapper">
        <div class="form-section">
            <div class="form-content">
                <div class="form-header">
                    <a href="{{ url_for('index') }}">
                        <i class="fas fa-arrow-left"></i> Back to Home
                    </a>
                    <h1>Welcome Back</h1>
                    <p>Sign in to your account</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="form-group">
                        <label>I am a:</label>
                        <select name="user_type" required>
                            <option value="patient">Patient</option>
                            <option value="doctor">Doctor</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <input type="password" name="password" id="loginPassword" placeholder="Enter your password" required>
                            <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="margin-bottom: 1rem;">
                        Sign In
                    </button>
                    
                    <div style="text-align: center; margin-bottom: 1rem;">
                        <a href="{{ url_for('forgot_password') }}" style="color: #0d9488; text-decoration: none; font-size: 0.8125rem;">
                            Forgot Password?
                        </a>
                    </div>

                    <div class="form-footer">
                        <p>Don't have an account?</p>
                        <a href="{{ url_for('register_patient') }}">Create Account</a>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="image-section">
            <img src="{{ url_for('static', filename='images/francis-odeyemi-Xq-RY9z8VY4-unsplash.jpg') }}" alt="African healthcare">
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector('i');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>
{% endblock %}
